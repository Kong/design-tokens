name: On closing PR
on:
  pull_request:
    types: ['closed']

permissions:
  pull-requests: write
  contents: read

jobs:
  unpublish:
    name: Remove preview consumption comments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove preview comment — @kong/design-tokens
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: pr_preview_@kong/design-tokens
          delete: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove preview comment — @kong/stylelint-plugin-design-tokens
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: pr_preview_@kong/stylelint-plugin-design-tokens
          delete: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove preview comment — @kong/eslint-plugin-design-tokens
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: pr_preview_@kong/eslint-plugin-design-tokens
          delete: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
